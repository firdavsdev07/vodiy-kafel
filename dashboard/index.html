<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <!-- Logotip — kafel namunalari (favicon.ico: 16/32/48 bir faylda). -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vodiy Kafel — boshqaruv paneli</title>
    <!-- Rejim bo'yashdan OLDIN qo'llanadi — miltillash bo'lmasin (src/shared/lib/theme.ts bilan bir xil mantiq). -->
    <script>
      (function () {
        var theme;
        try { theme = localStorage.getItem('vk-dashboard-theme'); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
