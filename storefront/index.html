<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <!-- Logotip — kafel namunalari (favicon.ico: 16/32/48 bir faylda). -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B0A" />
    <!-- Birinchi ekranda aynan shu ikkitasi ishlatiladi: 400 — matn, 500 — h1.
         600/700 pastroqda kerak bo'ladi, ularni oldindan tortish shart emas. -->
    <link rel="preload" href="/fonts/manrope-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/manrope-500.woff2" as="font" type="font/woff2" crossorigin />

    <!-- ⚠ BU YERDA `<title>` VA `<meta name="description">` YO'Q (S-036).
         Ularni har sahifa o'zi beradi (`src/components/ui/Seo.jsx`) —
         React 19 bu teglarni komponentdan `<head>` ga o'zi ko'chiradi.

         Statik nusxa qoldirilmadi: React o'zinikini QO'SHADI, eskisini
         o'chirmaydi — natijada ikkita `<title>` va ikkita `description`
         paydo bo'lardi, va robotlar ko'pincha BIRINCHISINI oladi, ya'ni
         mahsulot havolasi "Premium keramik yuzalar" bo'lib ko'rinardi.

         ⚠ Buning narxi: JS ishlatmaydigan robot xom HTML'da sarlavha
           ko'rmaydi. Lekin u KONTENTNI ham ko'rmaydi — sayt toza SPA.
           Ikkalasining ham yechimi bitta: S-038 (prerender). -->
    <!-- T-017: JS kelguncha ko'rinadigan ochilish ekrani. `#root` ICHIDA —
         React birinchi chizishda o'zi almashtiradi. Fon — body'niki (bone),
         shuning uchun keyingi `Preloader` / sahifa ustidan chaqnash yo'q.
         200 ms kechikish — tez internetda umuman ko'rinmaydi. -->
    <style>
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: #eeece5; color: #71685e; font: 500 12px/1.4 'Manrope', ui-sans-serif, system-ui, sans-serif; letter-spacing: .22em; text-transform: uppercase; opacity: 0; animation: boot-in .3s ease-out .2s forwards; }
      .boot img { width: 60px; height: 60px; border-radius: 12px; }
      .boot-line { width: 120px; height: 2px; overflow: hidden; background: #d8d3c8; }
      .boot-line::after { content: ''; display: block; width: 40%; height: 100%; background: #0b0b0a; animation: boot-slide 1.1s cubic-bezier(.16, 1, .3, 1) infinite; }
      @keyframes boot-in { to { opacity: 1; } }
      @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .boot { animation: none; opacity: 1; } .boot-line::after { animation: none; width: 100%; opacity: .5; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-live="polite">
        <img src="/favicon-192.png" alt="" />
        <div class="boot-line" aria-hidden="true"></div>
        <span>Vodiy Kafel</span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
